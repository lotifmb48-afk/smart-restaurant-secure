services:
  smart-restaurant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-restaurant
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_FILE: /app/data/restaurant.sqlite
    volumes:
      - restaurant_data:/app/data

volumes:
  restaurant_data:
