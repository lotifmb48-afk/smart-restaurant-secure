```yaml
services:
  smart-restaurant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-restaurant
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - restaurant_data:/app/data

volumes:
  restaurant_data:
```
